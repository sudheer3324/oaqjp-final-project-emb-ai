
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection</title>
</head>
<body>
    <h1>Emotion Detection Application</h1>

    <p>Enter a sentence to detect its emotions:</p>

    <textarea
        id="textToAnalyze"
        rows="5"
        cols="60"
        placeholder="Type your sentence here..."
    ></textarea>

    <br><br>

    <button onclick="runEmotionDetection()">Analyze Emotion</button>

    <h2>Result</h2>
    <div id="system_response">Your result will appear here.</div>

    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
